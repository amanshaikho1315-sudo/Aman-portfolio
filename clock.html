<!DOCTYPE html>
<html>
<head>
<title>Digital Clock</title>
<style>
body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
    margin-top:100px;
}
#clock{
    font-size:50px;
    background:#222;
    padding:20px;
    border-radius:15px;
    display:inline-block;
}
</style>
</head>

<body>

<h2>Digital Clock</h2>
<div id="clock"></div>

<script>
function clock(){
    document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
}

setInterval(clock,1000);
clock();
</script>

</body>
</html>
